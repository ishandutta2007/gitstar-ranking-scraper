<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d11" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b224ef" />
      <stop offset="100%" stop-color="#7579ff" />
    </linearGradient>

    <linearGradient id="gold-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#f59f00" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS Animations for Dynamic Effects */
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.35; }
      50% { transform: translate(40px, -20px) scale(1.15); opacity: 0.55; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      50% { transform: translate(-30px, 25px) scale(1.2); opacity: 0.5; }
    }
    @keyframes floatChartBar {
      0%, 100% { height: 60px; y: 200px; }
      50% { height: 95px; y: 165px; }
    }
    @keyframes floatChartBar2 {
      0%, 100% { height: 110px; y: 150px; }
      50% { height: 75px; y: 185px; }
    }
    @keyframes floatChartBar3 {
      0%, 100% { height: 85px; y: 175px; }
      50% { height: 130px; y: 130px; }
    }
    @keyframes floatStar {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(12deg); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .orb-1 { animation: pulseOrb1 8s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; }
    .bar-1 { animation: floatChartBar 4s ease-in-out infinite; }
    .bar-2 { animation: floatChartBar2 5s ease-in-out infinite; }
    .bar-3 { animation: floatChartBar3 4.5s ease-in-out infinite; }
    .star-anim { animation: floatStar 3.5s ease-in-out infinite; transform-origin: center; }
    .animated-line { stroke-dasharray: 12, 12; animation: dashMove 15s linear infinite; }
  </style>

  <!-- Base Card Container -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Kept in Background z-index) -->

  <!-- Glowing Orbs in Background -->
  <circle class="orb-1" cx="200" cy="100" r="140" fill="#00f2fe" opacity="0.25" filter="url(#glow)" />
  <circle class="orb-2" cx="1000" cy="240" r="160" fill="#7579ff" opacity="0.2" filter="url(#glow)" />

  <!-- Subtle Tech Grid Lines in Background -->
  <g opacity="0.12" stroke="#8b949e" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="170" x2="1200" y2="170" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
  </g>

  <!-- Animated Floating Chart Bars on Right Side (Pushed Background) -->
  <g opacity="0.35" transform="translate(860, 40)">
    <rect class="bar-1" x="0" y="200" width="22" height="60" rx="4" fill="url(#accent-cyan)" />
    <rect class="bar-2" x="35" y="150" width="22" height="110" rx="4" fill="url(#accent-purple)" />
    <rect class="bar-3" x="70" y="175" width="22" height="85" rx="4" fill="url(#accent-cyan)" />
    <rect class="bar-1" x="105" y="130" width="22" height="130" rx="4" fill="url(#accent-purple)" />
    <rect class="bar-2" x="140" y="180" width="22" height="80" rx="4" fill="url(#accent-cyan)" />
  </g>

  <!-- Glowing Animated Sine/Trend Line (Right Side) -->
  <path class="animated-line" d="M 820 220 Q 900 120 980 180 T 1140 100" fill="none" stroke="url(#accent-cyan)" stroke-width="3" opacity="0.5" filter="url(#glow)" />

  <!-- FOREGROUND CONTENT & TEXT (Ensured high contrast and foreground z-index) -->

  <!-- Star Icon with Glow -->
  <g class="star-anim" transform="translate(90, 85)">
    <path d="M25 0 L32.7 15.6 L50 18.1 L37.5 30.3 L40.5 47.6 L25 39.4 L9.5 47.6 L12.5 30.3 L0 18.1 L17.3 15.6 Z" fill="url(#gold-star)" filter="url(#glow)" />
  </g>

  <!-- Pill Badge ABOVE Title -->
  <g transform="translate(160, 68)">
    <rect width="210" height="30" rx="15" fill="#1f242d" stroke="#388bfd" stroke-width="1.5" />
    <circle cx="18" cy="15" r="5" fill="#3fb950" filter="url(#soft-glow)" />
    <text x="32" y="20" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">AUTOMATED TOOLKIT</text>
  </g>

  <!-- Main Title Text -->
  <text x="90" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
    Gitstar Ranking Scraper
  </text>

  <!-- Subtitle Text -->
  <text x="90" y="195" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">
    Extracting top GitHub developer insights, star metrics &amp; owned vs. forked repos.
  </text>

  <!-- Feature Tags / Micro Badges -->
  <g transform="translate(90, 235)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="165" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="14" y="21" fill="#7ee787" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">✓ Page Web Scraper</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(180, 0)">
      <rect width="185" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="14" y="21" fill="#79c0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">✓ GitHub API Enrichment</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(380, 0)">
      <rect width="175" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="14" y="21" fill="#d2a8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">✓ README Leaderboard</text>
    </g>
  </g>
</svg>
